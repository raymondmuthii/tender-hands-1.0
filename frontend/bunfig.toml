# Bun package manager configuration
[install]
# Generate a human-readable lockfile (bun.lock) in addition to the binary version
saveTextLockfile = true

# Security: 24-hour supply-chain guard
# Skip package versions published less than 24 hours ago to protect against
# compromised packages or typosquatting attacks
minimumReleaseAge = 86400

# Packages that bypass the 24-hour guard
# Add packages here only after user confirmation
# (currently empty - all packages subject to 24-hour wait)
minimumReleaseAgeExcludes = []
